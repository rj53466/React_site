        .text-gradient {
            background: linear-gradient(to right, #22d3ee, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Blur-In Animation */
        @keyframes blur-in {
            0% {
                filter: blur(20px);
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            100% {
                filter: blur(0);
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-blur-in {
            animation: blur-in 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        /* Animated Gradient Effect */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .animate-text-shimmer {
            background: linear-gradient(to right, #22d3ee 20%, #3b82f6 40%, #60a5fa 50%, #3b82f6 60%, #22d3ee 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            text-fill-color: transparent;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s linear infinite;
        }

        /* Electric Border Animation */
        @keyframes electric-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .electric-border {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .electric-border::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                #22d3ee 5%,
                #3b82f6 15%,
                transparent 25%,
                transparent 50%,
                #22d3ee 55%,
                #3b82f6 65%,
                transparent 75%
            );
            animation: electric-rotate 4s linear infinite;
            z-index: -2;
        }

        .electric-border::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0f172a; /* Slate-900 to blend with section */
            border-radius: inherit;
            z-index: -1;
        }

        .mobile-nav-item {
